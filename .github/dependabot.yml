# Dependabot keeps the pinned versions current without surprises:
# once a week it opens pull requests that update uv.lock and the GitHub Actions in ci.yml.
# Every update goes through CI before a maintainer merges it.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pyright", "pytest", "cryptography"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
