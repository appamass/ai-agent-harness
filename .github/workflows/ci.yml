# CI for ai-agent-harness. Runs on every push and pull request.
#
# - "check" installs the exact versions from uv.lock, so a new release of ruff, mypy, pyright, or
#   pytest can never turn CI red by surprise. Run the same commands locally (see AGENTS.md).
# - "lowest" installs the lowest versions that pyproject.toml allows (e.g. pydantic 2.13) and runs
#   the tests, so the lower bounds we promise to users are real.
# - Dependabot (.github/dependabot.yml) proposes updates to uv.lock and to these actions as pull requests.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the checkpoint store tests (tests/test_postgres_store.py, contract tests, stress test)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HARNESS_TEST_POSTGRES_DSN: postgresql://harness:harness@localhost:5432/harness_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies (fails if uv.lock does not match pyproject.toml)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint and format
        run: |
          ruff check ai_agent_harness examples tests
          ruff format --check ai_agent_harness examples tests
      - name: Type check (mypy strict)
        run: mypy ai_agent_harness examples tests
      - name: Type check (pyright strict)
        run: pyright
      - name: Tests (including executable docs and stress test)
        run: pytest

  lowest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HARNESS_TEST_POSTGRES_DSN: postgresql://harness:harness@localhost:5432/harness_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Install the lowest allowed versions (does not touch uv.lock)
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: pytest
